default: &default
  adapter: postgresql
  encoding: unicode
  # The threads of Puma, and GoodJob in the same process: 1 connection to listen for new jobs,
  # 2 for its cron and scheduler and 1 for the thread that performs the jobs.
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 3).to_i + 1 + 2 + 1 %>

development:
  <<: *default
  database: redflags_development

development_datahub:
  <<: *default
  database: datahub_development

test:
  <<: *default
  database: redflags_test

test_datahub:
  <<: *default
  database: datahub_test

staging:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>

staging_datahub:
  <<: *default
  url: <%= ENV['DATAHUB_DATABASE_URL'] %>
  replica: true

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>

production_datahub:
  <<: *default
  url: <%= ENV['DATAHUB_DATABASE_URL'] %>
  replica: true
