servers:
  web:
    hosts:
      - dev.slovensko.digital
    options:
      # The web runs the jobs too (GoodJob), there is no worker or clock.
      memory: 600m

env:
  clear:
    RAILS_ENV: staging
    RAILS_LOG_LEVEL: info
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    APP_HOST: redflags.staging.slovensko.digital
    ROLLBAR_ENV: staging

proxy:
  host: redflags.staging.slovensko.digital

ssh:
  user: kamal
