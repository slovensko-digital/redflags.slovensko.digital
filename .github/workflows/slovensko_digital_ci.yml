name: Slovensko.Digital CI

on:
  push:
    branches: [master]
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PGHOST: localhost
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runner
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - run: bin/rails db:create db:schema:load --trace
      - run: bundle exec rspec

  # A pull request merged before its run starts runs on master too, so check the event as well.
  staging-deploy:
    name: Deploy to staging environment
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/staging_deploy.yml
    secrets: inherit

  gitlab-push:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dokku/github-action@master
        with:
          git_push_flags: '--force'
          git_remote_url: ssh://git@${{secrets['GITLAB_DEPLOY_HOST']}}/${{github.event.repository.name}}.git
          ssh_private_key: ${{secrets['GITLAB_DEPLOY_KEY']}}
