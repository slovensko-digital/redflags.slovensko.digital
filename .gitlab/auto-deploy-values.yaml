service:
  externalPort: 3000
  internalPort: 3000
image:
  secrets:
  - name: skdigital-bonet-registry
livenessProbe.initialDelaySeconds: 20
readinessProbe.initialDelaySeconds: 20 
application.migrateCommand: ["bundle", "exec", "rails", "db:migrate"]
# The web runs the jobs too (GoodJob), there is no worker or clock.
resources:
  requests:
    cpu: 20m
    memory: 300Mi
  limits:
    memory: 600Mi
